name: Release & Multi-Store Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag label when manually dispatching'
        type: string
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-verify-publish:
    name: Build, Verify & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --- Verification Gates ---
      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Security Linter
        run: npm run lint:security

      - name: Verify Sidepanel Is In Sync
        run: npm run sync:sidepanel:check

      - name: Verify Single-Source Version Parity
        run: npm run sync:version:check

      - name: Verify Release Digests
        run: npm run verify:digests

      - name: Run Test Suite
        run: npm test

      - name: Install Playwright Chromium for Live CI Hard Gates (G1-G9)
        run: npx playwright install chromium --with-deps

      - name: Run Section 4 Hard CI Gates (G1-G9)
        run: xvfb-run --auto-servernum npm run gates:ci

      # --- Multi-Target Production Builds ---
      - name: Build Extension (Chromium)
        run: npm run build

      - name: Build Extension (Firefox)
        run: npm run build:firefox

      - name: Build Extension Payload (Safari)
        run: npm run build:safari

      - name: Verify Manifests & Offline Assets
        run: |
          npx vitest run tests/dist-manifest.test.ts tests/offline-assets.test.ts
          npx vitest run tests/firefox-package.test.ts tests/firefox-manifest.test.ts

      # --- Package Browser Releases & Checksums ---
      - name: Package Multi-Browser Releases
        id: package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p artifacts

          # Package Chrome build from dist/
          (cd dist && zip -r -q "../artifacts/governworld-chrome-${RELEASE_TAG}.zip" .)

          # Package Firefox build from dist-firefox/
          (cd dist-firefox && zip -r -q "../artifacts/governworld-firefox-${RELEASE_TAG}.zip" .)

          CHROMIUM_ZIP="artifacts/governworld-chrome-${RELEASE_TAG}.zip"
          FIREFOX_ZIP="artifacts/governworld-firefox-${RELEASE_TAG}.zip"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "chromium_zip=$CHROMIUM_ZIP" >> "$GITHUB_OUTPUT"
          echo "firefox_zip=$FIREFOX_ZIP" >> "$GITHUB_OUTPUT"

          # Generate checksums
          sha256sum "$CHROMIUM_ZIP" "$FIREFOX_ZIP" > artifacts/SHA256SUMS.txt

      - name: Verify Packaged Zip Structure
        env:
          CHROMIUM_ZIP: ${{ steps.package.outputs.chromium_zip }}
        run: |
          node scripts/verify-release-zip.mjs "$CHROMIUM_ZIP" --check-only

      # --- GitHub Release Creation ---
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          CHROMIUM_ZIP: ${{ steps.package.outputs.chromium_zip }}
          FIREFOX_ZIP: ${{ steps.package.outputs.firefox_zip }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$CHROMIUM_ZIP" \
            "$FIREFOX_ZIP" \
            artifacts/SHA256SUMS.txt \
            --title "GovernWorld Extension ${RELEASE_TAG}" \
            --generate-notes
