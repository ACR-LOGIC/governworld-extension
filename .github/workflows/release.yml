name: Release & Multi-Store Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_chrome:
        description: 'Publish to Chrome Web Store'
        type: boolean
        default: true
      publish_firefox:
        description: 'Publish to Firefox Add-ons (AMO)'
        type: boolean
        default: true
      publish_edge:
        description: 'Publish to Microsoft Edge Add-ons'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-verify-publish:
    name: Build, Verify & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --- Verification Gates ---
      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Security Linter
        run: npm run lint:security

      - name: Verify Sidepanel Is In Sync
        run: npm run sync:sidepanel:check

      - name: Verify Release Digests
        run: npm run verify:digests

      - name: Run Test Suite
        run: npm test

      # --- Multi-Target Production Builds ---
      - name: Build Extension (Chromium)
        run: npm run build

      - name: Build Extension (Firefox)
        run: npm run build:firefox

      - name: Build Extension Payload (Safari)
        run: npm run build:safari

      - name: Verify Manifests & Offline Assets
        run: |
          npx vitest run tests/dist-manifest.test.ts tests/offline-assets.test.ts
          npx vitest run tests/firefox-package.test.ts tests/firefox-manifest.test.ts

      # --- Package Browser Releases & Checksums ---
      - name: Package Multi-Browser Releases
        id: package
        run: |
          mkdir -p artifacts

          # Package Chrome build from dist/
          (cd dist && zip -r -q "../artifacts/governworld-chrome-${{ github.ref_name }}.zip" .)

          # Package Firefox build from dist-firefox/
          (cd dist-firefox && zip -r -q "../artifacts/governworld-firefox-${{ github.ref_name }}.zip" .)

          CHROMIUM_ZIP="artifacts/governworld-chrome-${{ github.ref_name }}.zip"
          FIREFOX_ZIP="artifacts/governworld-firefox-${{ github.ref_name }}.zip"
          echo "chromium_zip=$CHROMIUM_ZIP" >> "$GITHUB_OUTPUT"
          echo "firefox_zip=$FIREFOX_ZIP" >> "$GITHUB_OUTPUT"

          # Generate checksums
          sha256sum "$CHROMIUM_ZIP" "$FIREFOX_ZIP" > artifacts/SHA256SUMS.txt

      - name: Verify Packaged Zip Structure
        run: |
          node scripts/verify-release-zip.mjs "${{ steps.package.outputs.chromium_zip }}" --check-only

      - name: Check Configured Store Credentials
        id: store_creds
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
        run: |
          if [ -n "$CHROME_CLIENT_ID" ]; then echo "has_chrome=true" >> "$GITHUB_OUTPUT"; else echo "has_chrome=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$FIREFOX_JWT_ISSUER" ]; then echo "has_firefox=true" >> "$GITHUB_OUTPUT"; else echo "has_firefox=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$EDGE_PRODUCT_ID" ]; then echo "has_edge=true" >> "$GITHUB_OUTPUT"; else echo "has_edge=false" >> "$GITHUB_OUTPUT"; fi

      # --- Store Publishing: Chrome Web Store ---
      - name: Upload & Publish to Chrome Web Store
        if: (github.event_name == 'push' || inputs.publish_chrome) && steps.store_creds.outputs.has_chrome == 'true'
        uses: mobilefirstllc/cws-publish@v1.0.4
        with:
          action: 'publish'
          client_id: ${{ secrets.CHROME_CLIENT_ID }}
          client_secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh_token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          extension_id: ${{ secrets.CHROME_EXTENSION_ID }}
          zip_file: ${{ steps.package.outputs.chromium_zip }}

      # --- Store Publishing: Firefox AMO ---
      - name: Sign & Publish to Firefox AMO
        if: (github.event_name == 'push' || inputs.publish_firefox) && steps.store_creds.outputs.has_firefox == 'true'
        uses: wdzeng/firefox-addon-action@v1
        with:
          addon_id: ${{ secrets.FIREFOX_ADDON_ID }}
          jwt_issuer: ${{ secrets.FIREFOX_JWT_ISSUER }}
          jwt_secret: ${{ secrets.FIREFOX_JWT_SECRET }}
          xpi_path: ${{ steps.package.outputs.firefox_zip }}
          self_hosted: false

      # --- Store Publishing: Microsoft Edge ---
      - name: Upload to Microsoft Edge Partner Center
        if: (github.event_name == 'push' || inputs.publish_edge) && steps.store_creds.outputs.has_edge == 'true'
        uses: plasmo-corp/edge-addons-action@v1
        with:
          product_id: ${{ secrets.EDGE_PRODUCT_ID }}
          client_id: ${{ secrets.EDGE_CLIENT_ID }}
          client_secret: ${{ secrets.EDGE_CLIENT_SECRET }}
          access_token_url: ${{ secrets.EDGE_ACCESS_TOKEN_URL }}
          zip_path: ${{ steps.package.outputs.chromium_zip }}

      # --- GitHub Release Creation ---
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GovernWorld Extension ${{ github.ref_name }}
          files: |
            artifacts/governworld-chrome-${{ github.ref_name }}.zip
            artifacts/governworld-firefox-${{ github.ref_name }}.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
